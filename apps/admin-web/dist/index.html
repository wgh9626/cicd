<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Web</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(680px, calc(100vw - 32px));
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      h1 { margin: 0 0 12px; font-size: 32px; }
      p { line-height: 1.7; color: #cbd5e1; }
      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        background: #22c55e;
        color: #052e16;
        font-weight: 700;
      }
      .muted { margin-top: 16px; font-size: 14px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Admin Web 已上线</h1>
      <p>这是一个用于打通前端 CI/CD 的最小前端项目。页面很简单，但胜在听话，不会跟流水线顶嘴。</p>
      <p>如果你能看到这个页面，说明静态构建、镜像构建和 Nginx 托管链路大概率已经打通。</p>
      <span class="badge">status: ok</span>
      <div class="muted">Generated by 皮皮虾 for pipeline validation.</div>
    </main>
  </body>
</html>
